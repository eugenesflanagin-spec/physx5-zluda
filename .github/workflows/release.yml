# Build, install-test and release the physx5-zluda package.
#
# How it runs:
#   * Push a tag like v5.11.0-3 (must equal pkgver-pkgrel in PKGBUILD) -> builds the package
#     in a fresh Arch container, install-tests it in another fresh one, and (only if the
#     tests pass) creates the GitHub release with the package, SHA256SUMS and the user guide.
#   * "Run workflow" button (or: gh workflow run release.yml --ref BRANCH) -> same build and
#     tests, but NO release: the files are kept as a downloadable artifact for a few days.
#
# Every step calls a script in packaging/ that you can also run on your own PC
# (CONTAINER=podman works too). No GPU code is run anywhere in this workflow.

name: Release package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# By default the jobs may only read the repository. Only the "release" job may create releases.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Read the version from PKGBUILD and check it against the tag.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version and check it against the tag
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VER=$(packaging/release-info.sh version)
          echo "PKGBUILD version: $VER"
          if [ "$REF_TYPE" = tag ]; then
            packaging/release-info.sh check "$REF_NAME"
            packaging/release-info.sh notes "$REF_NAME" > /dev/null
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  # 2. Build in a fresh archlinux:base-devel container (stock, generic x86-64 makepkg.conf).
  #    About 15 minutes on a standard runner; needs ~1.5 GB of disk.
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the package
        run: packaging/build.sh out
      - name: Check the file name
        run: ls -l out; test -f "out/physx5-zluda-$VER-x86_64.pkg.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg
          path: out/
          if-no-files-found: error

  # 3. Install it into a FRESH Arch container and run the non-GPU checks.
  test:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg
          path: built/
      - name: Install-test the package
        run: packaging/test-in-container.sh built "$VER"

  # 4. Collect the release files with SHA256SUMS and the notes (also on "Run workflow").
  assemble:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg
          path: built/
      - name: Collect the files and write SHA256SUMS
        run: |
          mkdir -p release
          cp "built/physx5-zluda-$VER-x86_64.pkg.tar.zst" docs/USER-GUIDE.md release/
          (cd release && sha256sum -- * > SHA256SUMS)
          n=$(find release -type f | wc -l); [ "$n" -eq 3 ] || { echo "::error::expected 3 release files, got $n"; ls -l release; exit 1; }
          ls -l release; cat release/SHA256SUMS
      - name: Release notes
        run: |
          packaging/release-info.sh notes "v$VER" > release-notes.md
          echo "physx5-zluda $VER" > release-title.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            release/
            release-notes.md
            release-title.txt
          if-no-files-found: error

  # 5. Create the GitHub release. Only for tag pushes, and only after the tests passed.
  release:
    if: github.ref_type == 'tag'
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release and upload files
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: .
      - name: Create the release
        run: |
          ls -l release
          # A published release for this tag already exists: stop, don't overwrite files people
          # may have downloaded. A leftover draft (an earlier run that failed half-way) is finished.
          if state=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$state" = true ]; then
              gh release upload "$TAG" release/* --clobber
              gh release edit "$TAG" --title "$(cat release-title.txt)" --notes-file release-notes.md --draft=false
            else
              echo "::error::release $TAG is already published; delete it first (gh release delete $TAG) to rebuild it"
              exit 1
            fi
          else
            gh release create "$TAG" release/* --verify-tag \
              --title "$(cat release-title.txt)" --notes-file release-notes.md
          fi
          gh release view "$TAG" --json url,assets -q '.url, (.assets[] | .name)'
